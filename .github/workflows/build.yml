name: Build Textly APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # পুরোনো sms_advanced প্যাকেজের namespace সমস্যা দূর করার জন্য ফিক্স স্ক্রিপ্ট
      - name: Fix package namespace issue
        run: |
          PUB_CACHE_DIR=$(flutter pub global pak 2>/dev/null || echo "$HOME/.pub-cache")
          SMS_ADVANCED_GRADLE="$HOME/.pub-cache/hosted/pub.dev/sms_advanced-1.1.0/android/build.gradle"
          if [ -f "$SMS_ADVANCED_GRADLE" ]; then
            echo "Fixing namespace in sms_advanced..."
            sed -i '/android {/a \    namespace "com.shounak.sms_advanced"' "$SMS_ADVANCED_GRADLE"
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Textly-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
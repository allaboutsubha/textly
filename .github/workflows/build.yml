name: Build Textly APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # sms_advanced প্যাকেজের ম্যানিফেস্ট এবং গ্রেডল ফিক্স করার স্ক্রিপ্ট
      - name: Fix sms_advanced package compatibility
        run: |
          MANIFEST_FILE="$HOME/.pub-cache/hosted/pub.dev/sms_advanced-1.1.0/android/src/main/AndroidManifest.xml"
          GRADLE_FILE="$HOME/.pub-cache/hosted/pub.dev/sms_advanced-1.1.0/android/build.gradle"

          if [ -f "$MANIFEST_FILE" ]; then
            echo "Removing package attribute from AndroidManifest.xml..."
            sed -i 's/package="com.elyudde.sms_advanced"//g' "$MANIFEST_FILE"
          fi

          if [ -f "$GRADLE_FILE" ]; then
            echo "Adding namespace to build.gradle..."
            if ! grep -q "namespace" "$GRADLE_FILE"; then
              sed -i '/android {/a \    namespace "com.elyudde.sms_advanced"' "$GRADLE_FILE"
            fi
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Textly-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
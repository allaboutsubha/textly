name: textly
description: "A professional SMS application built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # আমাদের এসএমএস অ্যাপের জন্য প্রয়োজনীয় প্যাকেজসমূহ
  sms_advanced: ^1.1.0
  permission_handler: ^11.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ভবিষ্যতে ফন্ট বা লোগো অ্যাড করার জন্য এটি কাজে লাগবে
  # assets:
  #   - assets/images/